<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CharanRuth - Gadwal's Own Shopping Mall</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">

<!-- HEADER -->
<header class="bg-white shadow sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
<h1 class="text-2xl font-black text-blue-600">CharanRuth<span class="text-orange-500">.com</span></h1>
<div class="flex-1 max-w-xl hidden md:flex">
<input id="search" onkeyup="searchProd()" type="text" placeholder="Search for Sarees, Shoes, Laptops..." class="w-full border-2 border-blue-500 rounded-l-lg px-4 py-2 outline-none">
<button class="bg-blue-600 text-white px-6 rounded-r-lg"><i class="fa fa-search"></i></button>
</div>
<div class="flex items-center gap-4">
<button onclick="toggleCart()" class="relative bg-gray-900 text-white px-5 py-2 rounded-full font-bold"><i class="fa fa-shopping-cart"></i> Cart <span id="cartCount" class="bg-orange-500 text-white text-xs px-2 py-0.5 rounded-full ml-1">0</span></button>
</div>
</div>
<!-- Mobile Search -->
<div class="md:hidden px-4 pb-3"><input id="searchM" onkeyup="searchProdM()" type="text" placeholder="Search products..." class="w-full border-2 border-blue-500 rounded-lg px-4 py-2 outline-none"></div>
<!-- Categories -->
<div class="bg-white border-t flex gap-2 px-4 py-2 overflow-x-auto">
<button onclick="filterCat('all',this)" class="cat-btn active bg-blue-600 text-white px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap">All</button>
<button onclick="filterCat('fashion',this)" class="cat-btn px-4 py-1.5 rounded-full text-sm font-bold border whitespace-nowrap">Fashion</button>
<button onclick="filterCat('shoes',this)" class="cat-btn px-4 py-1.5 rounded-full text-sm font-bold border whitespace-nowrap">👟 Shoes</button>
<button onclick="filterCat('electronics',this)" class="cat-btn px-4 py-1.5 rounded-full text-sm font-bold border whitespace-nowrap">Electronics</button>
<button onclick="filterCat('watches',this)" class="cat-btn px-4 py-1.5 rounded-full text-sm font-bold border whitespace-nowrap">Watches</button>
<button onclick="filterCat('sarees',this)" class="cat-btn px-4 py-1.5 rounded-full text-sm font-bold border whitespace-nowrap">🥻 Sarees</button>
<button onclick="filterCat('laptops',this)" class="cat-btn px-4 py-1.5 rounded-full text-sm font-bold border whitespace-nowrap">Laptops</button>
<button onclick="filterCat('groceries',this)" class="cat-btn px-4 py-1.5 rounded-full text-sm font-bold border whitespace-nowrap">Groceries</button>
</div>
</header>

<!-- HERO BANNER -->
<div class="max-w-7xl mx-auto p-3">
<div class="bg-gradient-to-r from-blue-600 to-purple-600 rounded-2xl p-6 md:p-10 text-white flex justify-between items-center">
<div><h2 class="text-3xl md:text-4xl font-black">Gadwal Special Sale!</h2><p class="mt-2 opacity-90">Pattu Sarees, Shoes & Laptops - Upto 70% OFF</p><button onclick="filterCat('sarees')" class="mt-4 bg-white text-blue-600 px-6 py-2 rounded-full font-bold">Shop Now</button></div>
<div class="hidden md:block text-6xl opacity-30"><i class="fa fa-shopping-bag"></i></div>
</div>
</div>

<!-- SUB CATEGORY FOR SHOES (Nee korika) -->
<div id="shoeSub" class="max-w-7xl mx-auto px-3 hidden"><div class="bg-white rounded-xl p-3 flex gap-3"><button onclick="filterCat('sneakers')" class="flex-1 bg-blue-50 border-2 border-blue-500 p-3 rounded-xl font-bold text-blue-600">👟 Sneakers (4)</button><button onclick="filterCat('loafers')" class="flex-1 bg-orange-50 border-2 border-orange-500 p-3 rounded-xl font-bold text-orange-600">👞 Loafers (3)</button></div></div>

<!-- PRODUCTS -->
<div class="max-w-7xl mx-auto p-3"><div id="grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3"></div></div>

<!-- CART SIDEBAR -->
<div id="cartSidebar" class="fixed inset-0 bg-black/50 hidden z-[100]"><div class="bg-white w-[90%] max-w-md h-full ml-auto p-5 flex flex-col"><div class="flex justify-between items-center mb-4"><h2 class="text-xl font-black">My Cart</h2><button onclick="toggleCart()" class="text-2xl">×</button></div><div id="cartItems" class="flex-1 overflow-y-auto space-y-3"></div><div class="border-t pt-4"><div class="flex justify-between font-black text-lg mb-3">Total: ₹<span id="cartTotal">0</span></div><button class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold">Checkout</button></div></div></div>

<script>
const products=[
{id:1,name:"Nike Air Max Sneakers",price:1999,cat:"sneakers",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
{id:2,name:"Puma Running White",price:4499,cat:"sneakers",img:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500"},
{id:3,name:"Nike Jordan Red Edition",price:5999,cat:"sneakers",img:"https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=500"},
{id:4,name:"Adidas Originals",price:5499,cat:"sneakers",img:"https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500"},
{id:5,name:"Bata Formal Loafer",price:2499,cat:"loafers",img:"https://images.unsplash.com/photo-1614252369475-531eba835eb1?w=500"},
{id:6,name:"Woodland Brown Loafer",price:3999,cat:"loafers",img:"https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500"},
{id:7,name:"Red Chief Leather",price:2999,cat:"loafers",img:"https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?w=500"},
{id:8,name:"Sony Bluetooth Headset",price:2990,cat:"electronics",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"},
{id:9,name:"Levis Cotton T-Shirt",price:1299,cat:"fashion",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"},
{id:10,name:"Fastrack Watch Black",price:3999,cat:"watches",img:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=500"},
{id:11,name:"Gadwal Pattu Saree",price:12500,cat:"sarees",img:"https://images.unsplash.com/photo-1610030469983-98e550d6193c?w=500"},
{id:12,name:"HP i7 Laptop 16GB",price:65999,cat:"laptops",img:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"},
{id:13,name:"Aashirvaad Atta 5kg",price:350,cat:"groceries",img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500"}
];
let cart=[];
function render(list){
 document.getElementById('grid').innerHTML=list.map(p=>`
 <div class="bg-white rounded-xl p-3 shadow-sm hover:shadow-lg transition">
 <img src="${p.img}" class="w-full h-36 object-contain bg-white rounded-lg">
 <h3 class="text-sm font-bold mt-2 h-10 overflow-hidden">${p.name}</h3>
 <p class="text-green-600 font-black mt-1">₹${p.price}</p>
 <button onclick="addCart(${p.id})" class="w-full mt-2 bg-blue-600 text-white py-2 rounded-lg font-bold text-sm">Add to Cart</button>
 </div>`).join('');
}
function filterCat(c,btn){
 if(btn){document.querySelectorAll('.cat-btn').forEach(b=>{b.classList.remove('active','bg-blue-600','text-white');b.classList.add('border')});btn.classList.add('active','bg-blue-600','text-white');btn.classList.remove('border');}
 document.getElementById('shoeSub').classList.add('hidden');
 if(c==='all') render(products);
 else if(c==='shoes'){document.getElementById('shoeSub').classList.remove('hidden');render(products.filter(p=>p.cat==='sneakers'||p.cat==='loafers'));}
 else {render(products.filter(p=>p.cat===c));}
}
function searchProd(){ let q=document.getElementById('search').value.toLowerCase(); render(products.filter(p=>p.name.toLowerCase().includes(q))); }
function searchProdM(){ let q=document.getElementById('searchM').value.toLowerCase(); render(products.filter(p=>p.name.toLowerCase().includes(q))); }
function addCart(id){ let p=products.find(x=>x.id===id); cart.push(p); document.getElementById('cartCount').innerText=cart.length; updateCart(); }
function updateCart(){ let total=cart.reduce((s,p)=>s+p.price,0); document.getElementById('cartTotal').innerText=total; document.getElementById('cartItems').innerHTML=cart.map((p,i)=>`<div class="flex gap-3 border p-2 rounded-lg"><img src="${p.img}" class="w-16 h-16 object-contain"><div class="flex-1"><p class="text-sm font-bold">${p.name}</p><p class="text-green-600 font-bold">₹${p.price}</p></div><button onclick="cart.splice(${i},1);document.getElementById('cartCount').innerText=cart.length;updateCart()" class="text-red-500">×</button></div>`).join(''); }
function toggleCart(){ document.getElementById('cartSidebar').classList.toggle('hidden'); }
render(products);
</script>
</body>
</html>
